name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      SESSION_SECRET: "ci-placeholder-secret"
      ADMIN_PASSWORD_HASH: "$2a$12$CIplaceholderCIplaceholderCIplaceholderCIplacehol"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm run build
